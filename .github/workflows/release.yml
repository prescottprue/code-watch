name: 🚀 Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write
  deployments: write

jobs:
  release:
    environment: production
    name: 🚀 Release
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm' # NOTE: Cache is for semantic-release deps which are installed using npm

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          semantic_version: ^18
          branch: main

      # Prod is only deployed if there are releasable changes
      - name: 👀 Read app name
        if: ${{ steps.semantic.outputs.new_release_published }}
        uses: SebRollen/toml-action@v1.2.0
        id: app_name
        with:
          file: fly.toml
          field: app

      - name: 🎈 Setup Fly
        if: ${{ steps.semantic.outputs.new_release_published }}
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: 🚀 Deploy Production
        if: ${{ steps.semantic.outputs.new_release_published }}
        # NOTE: ALGOLIA_ADMIN_API_KEY is manually set in Fly via fly secrets set ALGOLIA_ADMIN_API_KEY=secret-key
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --remote-only --build-arg COMMIT_SHA=${{ github.sha }} --app ${{ steps.app_name.outputs.value }} \
          --env VERSION=${{ steps.semantic.outputs.new_release_version }},ALGOLIA_APP_ID=$ALGOLIA_APP_ID,ALGOLIA_SEARCH_KEY=$ALGOLIA_SEARCH_KEY